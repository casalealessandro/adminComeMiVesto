name: Affiliate Catalog

on:
  pull_request:
    paths:
      - 'src/app/views/affiliate-catalog/**'
      - 'src/app/app.routes.ts'
      - 'src/app/app-popup-components.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.affiliate-catalog.spec.json'
      - '.github/workflows/affiliate-catalog.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Affiliate Catalog tests
        run: npm run test:affiliate-catalog

      - name: Build development app
        run: npm run build -- --configuration development
