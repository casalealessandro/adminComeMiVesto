name: Popup Core Phase D.0 tests

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  popup_core_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Popup Core characterization tests
        run: >-
          npm test -- --watch=false --browsers=ChromeHeadless
          --include=src/app/services/popup.service.spec.ts
          --include=src/app/services/overlay.service.spec.ts
          --include=src/app/components/modal-popup/modal-popup-wrapper/modal-popup-wrapper.component.spec.ts
          --include=src/app/components/modal-popup/modal-popup-content/modal-popup-content.component.spec.ts
          --include=src/app/components/overlay-component/overlay.component.spec.ts
          --include=src/app/widgets/ui-dialogs.spec.ts
