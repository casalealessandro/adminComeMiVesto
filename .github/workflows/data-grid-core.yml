name: DataGrid Core

on:
  pull_request:
    paths:
      - 'src/app/components/data-grid/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/data-grid-core.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run DataGrid tests
        run: npm run test:data-grid
