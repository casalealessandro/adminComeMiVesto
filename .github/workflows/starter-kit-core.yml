name: Starter Kit Core

on:
  pull_request:
    paths:
      - 'src/app/core/**'
      - 'src/app/app.config.ts'
      - 'src/app/app.routes.ts'
      - 'src/app/app-navigation.ts'
      - 'src/app/app-header-config.ts'
      - 'src/app/app-header-user.service.ts'
      - 'src/app/app-layout-session.service.ts'
      - 'src/app/app-popup-components.ts'
      - 'src/app/app.component.ts'
      - 'src/app/services/form.service.ts'
      - 'src/styles.scss'
      - 'src/styles/**'
      - 'scripts/check-core-boundaries.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/starter-kit-core.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Core dependency boundary
        run: npm run test:core-boundaries

      - name: Run DataGrid tests
        run: npm run test:data-grid

      - name: Build development application
        run: npm run build -- --configuration development
