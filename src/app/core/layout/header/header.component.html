<header id="header" class="header">
  <div class="header-container">
    <div class="item-left">
      <button
        type="button"
        class="hamburger"
        aria-label="Apri o chiudi il menu di navigazione"
        (click)="onToggleMenu()">
        <span class="mdi mdi-menu" aria-hidden="true"></span>
      </button>
    </div>

    <div class="item-center">
      <div class="logo-container">
        <img [src]="headerConfig.logoUrl" [alt]="headerConfig.logoAlt" class="logo-image" />
      </div>
    </div>

    <div class="item-right">
      <div class="profile-info">
        <button
          type="button"
          (click)="toggleDropDown($event)"
          class="button-info"
          aria-label="Apri menu profilo">
          <img
            [src]="userProfile?.photoURL || headerConfig.defaultAvatarUrl"
            [alt]="userProfile?.displayName || 'Profilo'"
            class="profile-img"
          />
          <span class="profile-copy" *ngIf="userProfile?.profileLabel">
            <span class="profile-label">{{ userProfile?.profileLabel }}</span>
            <span class="profile-action">Account</span>
          </span>
          <span class="mdi mdi-chevron-down profile-chevron" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </div>
</header>

<ng-template #dynamicContent let-close="close">
  <div class="dropdown-window" (mouseleave)="toggleDropDownF($event)">
    <div class="dropdown-content">
      <div class="user-profile">
        <span class="mdi mdi-account-circle-outline" aria-hidden="true"></span>
        <div>
          <strong>{{ userProfile?.profileLabel || userProfile?.displayName || 'Profilo' }}</strong>
          <span>ComeMiVesto Admin</span>
        </div>
      </div>
      <button type="button" class="dropdown-item" (click)="logout()">
        <span class="mdi mdi-logout" aria-hidden="true"></span>
        Logout
      </button>
    </div>
  </div>
</ng-template>
