<main
  class="mi-container"
  [ngClass]="{
    'menu-over': mode === 'over',
    'menu-side': mode === 'side',
    'menu-push': mode === 'push'
  }"
>
  <ng-container>
    <app-header *ngIf="isLogin"></app-header>

    <div
      *ngIf="isLogin"
      class="verticalMenucontainer sidebar"
      [ngClass]="{ open: isMenuOpen }"
    >
      <app-menu></app-menu>
    </div>
    <button *ngIf="isLogin && isMenuOpen && mode === 'over'" class="menu-backdrop" aria-label="Chiudi menu" (click)="closeMenu()"></button>
  </ng-container>

  <div class="container no-padding ana-container">
    <router-outlet></router-outlet>
  </div>
  <!-- <app-popup-wrapper></app-popup-wrapper> -->

  <!-- <app-footer ></app-footer>-->
</main>
