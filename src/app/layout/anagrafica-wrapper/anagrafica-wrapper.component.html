<section class="admin-page-wrapper" [ngClass]="cssClass">
  <app-caption
    [caption]="caption"
    [addButtonShow]="addButtonShow"
    (emitAddEvent)="onAddClick()"
  ></app-caption>

  <div class="admin-page-content">
    <div *ngIf="subTitle" class="page-subtitle">
      <span class="mdi mdi-database" aria-hidden="true"></span>
      <h3>{{ subTitle }}</h3>
    </div>

    <div *ngIf="tip" class="alert alert-primary d-flex align-items-center" role="status">
      <span class="mdi mdi-lightbulb-alert-outline me-2" aria-hidden="true"></span>
      {{ tip }}
    </div>

    <div *ngIf="showSpinner" class="loading-state" aria-live="polite">
      <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
      Caricamento in corso...
    </div>

    <ng-content></ng-content>
  </div>
</section>
