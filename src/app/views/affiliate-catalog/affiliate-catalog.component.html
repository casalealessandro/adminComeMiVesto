<app-anagrafica-wrapper
  caption="Catalogo Affiliati"
  subTitle="Gestione catalogo e sincronizzazioni affiliate"
  tip="Gestisci il catalogo affiliato usando esclusivamente le API backend dedicate."
  cssClass="affiliate-catalog-wrapper">

  <section class="affiliate-catalog" aria-labelledby="affiliate-catalog-title">
    <div class="affiliate-catalog__intro">
      <span class="mdi mdi-link-variant affiliate-catalog__icon" aria-hidden="true"></span>
      <div>
        <h1 id="affiliate-catalog-title">Catalogo Affiliati</h1>
        <p>
          Configura progressivamente programmi, feed, prodotti e sincronizzazioni senza accessi diretti
          a provider esterni o Firestore dal browser.
        </p>
      </div>
    </div>

    <nav class="affiliate-catalog__nav" aria-label="Sezioni Catalogo Affiliati">
      <a routerLink="programs" routerLinkActive="active" class="affiliate-catalog__nav-item">
        <span class="mdi mdi-domain" aria-hidden="true"></span>
        Programmi
      </a>
      <a routerLink="feeds" routerLinkActive="active" class="affiliate-catalog__nav-item">
        <span class="mdi mdi-rss" aria-hidden="true"></span>
        Feed
      </a>
      <a routerLink="products" routerLinkActive="active" class="affiliate-catalog__nav-item">
        <span class="mdi mdi-hanger" aria-hidden="true"></span>
        Prodotti
      </a>
      <a routerLink="sync-runs" routerLinkActive="active" class="affiliate-catalog__nav-item">
        <span class="mdi mdi-sync-circle" aria-hidden="true"></span>
        Sincronizzazioni
      </a>
    </nav>

    <div class="affiliate-catalog__content">
      <router-outlet></router-outlet>
    </div>
  </section>
</app-anagrafica-wrapper>
