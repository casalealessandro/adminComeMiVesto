<app-anagrafica-wrapper
  caption="Catalogo Affiliati"
  subTitle="Gestisci programmi, feed, prodotti e sincronizzazioni."
  cssClass="affiliate-catalog-wrapper">

  <section class="affiliate-catalog">
    <nav class="affiliate-catalog__nav" aria-label="Sezioni Catalogo Affiliati">
      <a routerLink="programs" routerLinkActive="active" ariaCurrentWhenActive="location" class="affiliate-catalog__nav-item">
        <span class="mdi mdi-domain" aria-hidden="true"></span>
        Programmi
      </a>
      <a routerLink="feeds" routerLinkActive="active" ariaCurrentWhenActive="location" class="affiliate-catalog__nav-item">
        <span class="mdi mdi-rss" aria-hidden="true"></span>
        Feed
      </a>
      <a routerLink="products" routerLinkActive="active" ariaCurrentWhenActive="location" class="affiliate-catalog__nav-item">
        <span class="mdi mdi-hanger" aria-hidden="true"></span>
        Prodotti
      </a>
      <a routerLink="outfit-preview" routerLinkActive="active" ariaCurrentWhenActive="location" class="affiliate-catalog__nav-item">
        <span class="mdi mdi-auto-fix" aria-hidden="true"></span>
        Preview AI
      </a>
      <a routerLink="ai-creators" routerLinkActive="active" ariaCurrentWhenActive="location" class="affiliate-catalog__nav-item">
        <span class="mdi mdi-account-star-outline" aria-hidden="true"></span>
        Creator AI
      </a>
      <a routerLink="sync-runs" routerLinkActive="active" ariaCurrentWhenActive="location" class="affiliate-catalog__nav-item">
        <span class="mdi mdi-sync-circle" aria-hidden="true"></span>
        Sincronizzazioni
      </a>
      <a routerLink="audit" routerLinkActive="active" ariaCurrentWhenActive="location" class="affiliate-catalog__nav-item">
        <span class="mdi mdi-chart-box-outline" aria-hidden="true"></span>
        Analisi catalogo
      </a>
    </nav>

    <div class="affiliate-catalog__content">
      <router-outlet></router-outlet>
    </div>
  </section>
</app-anagrafica-wrapper>
