<section class="affiliate-product-form" aria-live="polite">
  <p *ngIf="loading" class="text-muted">Caricamento prodotto…</p>
  <div *ngIf="error" class="alert alert-danger" role="alert">{{ error }}</div>

  <ng-container *ngIf="!loading && product as item">
    <header class="affiliate-product-form__product">
      <div class="affiliate-product-form__image">
        <img *ngIf="productImage(item) as image; else imagePlaceholder"
          [src]="image" [alt]="'Foto di ' + item.name" loading="lazy">
        <ng-template #imagePlaceholder>
          <span class="mdi mdi-hanger" aria-hidden="true"></span>
        </ng-template>
      </div>
      <div class="affiliate-product-form__identity">
        <p class="affiliate-product-form__brand">{{ item.brand || 'Brand non disponibile' }}</p>
        <h3 class="affiliate-product-form__name">{{ item.name }}</h3>
        <p class="affiliate-product-form__hint">Modifica la classificazione ComeMiVesto. I dati originali del feed non vengono alterati.</p>
      </div>
    </header>

    <div class="form-check form-switch affiliate-product-form__visibility">
      <input class="form-check-input" type="checkbox" id="affiliate-product-popup-visible"
        [(ngModel)]="enabledForApp" [disabled]="!item.active || saving">
      <label class="form-check-label" for="affiliate-product-popup-visible">Mostra questo prodotto in ComeMiVesto</label>
    </div>
    <app-dynamic-form
      [service]="formId"
      [editData]="formData"
      [showBottomButtons]="true"
      [inputBtnLeftName]="'Annulla'"
      [inputBtnRightName]="'Salva modifiche'"
      [loading]="saving"
      (submitFormEvent)="handleForm($event)">
    </app-dynamic-form>
  </ng-container>
</section>
