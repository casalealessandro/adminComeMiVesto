<app-anagrafica-wrapper caption="Gestione Occasioni" subTitle="Tassonomia condivisa tra generatore AI e ComeMiVesto"
  tip="Gestisci nomi, ordine e disponibilità. I codici identificativi esistenti non cambiano."
  [addButtonShow]="true" [showSpinner]="loading && !rows.length"
  (emittEventButton)="toolbarAction($event)">
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
  <p>Prima configurazione: <button type="button" class="btn btn-outline-primary btn-sm" (click)="seed()" [disabled]="loading">Inizializza occasioni predefinite</button></p>
  <app-data-grid [idTable]="'outfit-occasions-grid'" [colonne]="columns" [dataSource]="rows" [remoteOperation]="false"
    [isEditable]="false" [isEditableNewRow]="false" [isEditableEditRow]="false" [isEditableDeleteRow]="false"
    [showToolbarTop]="false" [showToolbarBottom]="false" [isSearchable]="false" [tableHeight]="500"
    (emittendButtonCellClick)="gridAction($event)"></app-data-grid>
</app-anagrafica-wrapper>
<div *ngIf="editorOpen" class="occasion-editor-backdrop" style="position:fixed;inset:0;z-index:2000;display:grid;place-items:center;background:rgb(15 23 42 / .45);padding:1rem">
  <section role="dialog" aria-modal="true" aria-label="Modifica occasione" style="background:var(--cmv-color-surface,#fff);border-radius:.75rem;padding:1.5rem;width:min(560px,100%);max-height:90vh;overflow:auto">
    <h2>{{ editingOriginalId ? 'Modifica occasione' : 'Nuova occasione' }}</h2>
    <p *ngIf="editingOriginalId">Codice: <strong>{{ editingOriginalId }}</strong> (non modificabile)</p>
    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
    <app-dynamic-form *ngIf="formVisible" [service]="formId" [editData]="editing" [loading]="loading"
      inputBtnLeftName="Annulla" inputBtnRightName="Salva" (submitFormEvent)="handleForm($event)"></app-dynamic-form>
    <button class="btn btn-outline-secondary mt-2" type="button" (click)="close()" [disabled]="loading">Chiudi</button>
  </section>
</div>
