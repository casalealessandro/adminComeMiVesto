<main class="reports"><h1>Segnalazioni</h1><div *ngIf="error" class="alert alert-danger">{{error}}</div><p *ngIf="!loading&&!reports.length" class="empty">Nessuna segnalazione.</p><div class="cards"><article *ngFor="let r of reports"><div><strong>{{r.reason||'Segnalazione'}}</strong><span class="badge text-bg-secondary">{{r.status||'pending'}}</span></div><p>{{r.description||'Nessuna descrizione'}}</p><small>{{r.createdAt|date:'short'}}</small><footer><button class="btn btn-sm btn-outline-primary" (click)="detail(r)">Dettaglio</button><button class="btn btn-sm btn-outline-danger" (click)="remove(r)">Elimina</button></footer></article></div></main><div class="backdrop" *ngIf="selected"><section><h2>Dettaglio segnalazione</h2><p>{{selected.description}}</p><label>Stato<select class="form-select" [(ngModel)]="selected.status"><option>pending</option><option>resolved</option><option>rejected</option></select></label><footer><button class="btn btn-outline-secondary" (click)="selected=undefined">Chiudi</button><button class="btn btn-primary" (click)="save()">Salva</button></footer></section></div>
