<app-anagrafica-wrapper
  [caption]="outfitTitle"
  [subTitle]="subtitle"
  [tip]="'...'"
  [addButtonShow]="false"
  [showSpinner]="loading()"
  
  
>

<div *ngIf="error()" class="alert alert-danger" role="alert">{{ error() }}</div>
<div *ngIf="missingFormFields().length" class="alert alert-warning" role="status">
  Configurazione Firebase <code>outfitForm</code>: campi modificabili mancanti nel JSON:
  <strong>{{ missingFormFields().join(', ') }}</strong>. Aggiungerli dalla gestione form per renderli visibili.
</div>

<label *ngIf="!outfitId" class="target-user">Creator target
  <select class="form-select" [(ngModel)]="targetUserId">
    <option value="">Comportamento predefinito backend</option>
    <option *ngFor="let user of targetUsers" [value]="user.uid">{{user.displayName || user.email}} ({{user.role || 'creator'}})</option>
  </select>
</label>

<app-foto-outfit
[image]="imageUrl"
[tags]="tags"
(eventImageTags)="setTags($event)"
>

</app-foto-outfit>

<app-dynamic-form
*ngIf="formReady()"
[loading]="saving()"
[editData]="outfitData()"
[service]="'outfitForm'"
(submitFormEvent)="submitFormOutfit($event)"
(functionalInputFormEvent)="btnInputEvent($event)"

>

</app-dynamic-form>
</app-anagrafica-wrapper>
