<app-anagrafica-wrapper [caption]="'Elenco Outfit caricati dagli utenti'" [subTitle]="subtitle"
  [addButtonShow]="true" [showSpinner]="false" [customToolbarButtons]="bulkDeleteToolbarButtons"
  (emittEventButton)="eventToolbarOutfit($event)">
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
  <p *ngIf="!gridReady && !error" aria-live="polite">Caricamento tassonomie…</p>
  <button *ngIf="!gridReady && error" type="button" class="btn btn-outline-primary"
    (click)="initializeTaxonomies()">Riprova</button>

  <div *ngIf="gridReady" class="desktop-grid">
    <app-data-grid #outfitsGrid
      [colonne]="columns" [idTable]="'outfits-grid'"
      [dataProvider]="dataProvider" [remoteOperation]="true"
      [initialRemoteSort]="{ field: 'createdAt', direction: 'desc' }"
      [selectionRowMode]="'multiple'" [showBuiltInBulkDelete]="false"
      [rowContextActions]="menuActions" [showRowContextMenu]="false"
      [isEditable]="true" [isEditableEditRow]="false" [isEditableNewRow]="false"
      [isEditableDeleteRow]="false" [showFilter]="true"
      [showToolbarTop]="true" [showToolbarBottom]="false"
      [isSearchable]="true"
      (emittendButtonCellClick)="gridAction($event)">
    </app-data-grid>
  </div>

  <div *ngIf="gridReady" class="mobile-only">
    <label class="search">Cerca outfit
      <input class="form-control" [(ngModel)]="search" (ngModelChange)="onMobileSearchChange()"
        placeholder="Titolo, stile, occasione o utente" />
    </label>
  </div>
  <p *ngIf="gridReady && !loading && !outfits.length" class="empty mobile-only">Nessun outfit trovato.</p>
  <div *ngIf="gridReady" class="mobile-cards">
    <article *ngFor="let item of outfits; trackBy: trackById">
      <img [src]="item.imageUrl" [alt]="item.title">
      <div class="card-body">
        <h2>{{ item.title }}</h2>
        <p>{{ item.userName }}</p>
        <p>{{ item.style }} · {{ item.occasion || 'Occasione non specificata' }}</p>
        <span class="badge" [class.text-bg-success]="item.status === 'approved'"
          [class.text-bg-warning]="item.status === 'pending'"
          [class.text-bg-danger]="item.status === 'rifiutato'"
          [class.text-bg-secondary]="item.status === 'suspended'">{{ item.status }}</span>
        <small>{{ item.createdAt | date:'short' }}</small>
        <div class="actions">
          <button class="btn btn-sm btn-primary" (click)="editOutfit(item)">Modifica</button>
          <button *ngIf="item.status !== 'approved'" class="btn btn-sm btn-outline-success"
            [disabled]="isBusy(item)" (click)="updateStatus(item,'approved')">Approva</button>
          <button class="btn btn-sm btn-outline-secondary" [disabled]="isBusy(item)"
            (click)="toggleSuspension(item)">{{ item.status === 'suspended' ? 'Riabilita' : 'Disabilita' }}</button>
          <button class="btn btn-sm btn-outline-danger" [disabled]="isBusy(item)"
            (click)="removeOutfit(item)">Elimina</button>
        </div>
      </div>
    </article>
  </div>
  <button *ngIf="gridReady && hasMore" class="btn btn-outline-primary mobile-only more"
    [disabled]="loading || loadingMore" (click)="loadMore()">Carica altri</button>
  <p *ngIf="loading || loadingMore" class="mobile-only" aria-live="polite">Caricamento…</p>
</app-anagrafica-wrapper>
