<main class="colors"><h1>Colori</h1><div *ngIf="error" class="alert alert-danger">{{error}}</div><form (ngSubmit)="save()"><label>Codice<input class="form-control" name="id" [(ngModel)]="editing.id" [readonly]="editingOriginalId !== null"></label><label>Nome<input class="form-control" name="value" [(ngModel)]="editing.value" required></label><label>HEX<input class="form-control" name="hex" [(ngModel)]="editing.hex" pattern="^#[0-9A-Fa-f]{6}$" required></label><span class="swatch" [style.background]="editing.hex"></span><button class="btn btn-primary" [disabled]="loading">Salva</button></form><p *ngIf="!loading&&!colors.length" class="empty">Nessun colore disponibile.</p><div class="cards"><article *ngFor="let color of colors"><span class="swatch" [style.background]="color.hex"></span><strong>{{color.value}}</strong><code>{{color.id}} · {{color.hex}}</code><div><button class="btn btn-sm btn-outline-primary" (click)="edit(color)">Modifica</button><button class="btn btn-sm btn-outline-danger" (click)="remove(color)">Elimina</button></div></article></div></main>
