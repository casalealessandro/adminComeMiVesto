<app-anagrafica-wrapper
  [caption]="'Pagine statiche'"
  [subTitle]="subtitle"
  [addButtonShow]="true"
  [showSpinner]="loading"
  (emittEventButton)="eventToolbarStaticPages($event)">
  <div *ngIf="error" class="alert alert-danger error" role="alert">
    <span>{{ error }}</span>
    <button type="button" class="btn btn-sm btn-outline-danger" (click)="refresh()">Riprova</button>
  </div>

  <form class="filters" (ngSubmit)="applySearch()">
    <label class="search">
      Cerca
      <input
        type="search"
        name="search"
        class="form-control"
        [(ngModel)]="search"
        (ngModelChange)="applySearch()"
        placeholder="Titolo o slug">
    </label>
    <div class="filter-actions">
      <button type="button" class="btn btn-outline-secondary" [disabled]="loading" (click)="refresh()">
        <span class="mdi mdi-refresh" aria-hidden="true"></span>
        Aggiorna
      </button>
    </div>
  </form>

  <p *ngIf="!loading && !error && !filteredPages.length" class="empty">
    Nessuna pagina trovata. {{ search ? 'Modifica i criteri di ricerca.' : 'Crea la prima pagina statica.' }}
  </p>

  <div class="desktop-grid">
    <app-data-grid
      *ngIf="!loading && filteredPages.length"
      [idTable]="'static-pages-grid'"
      [colonne]="columns"
      [dataSource]="filteredPages"
      [remoteOperation]="false"
      [isEditable]="false"
      [isEditableNewRow]="false"
      [isEditableEditRow]="false"
      [isEditableDeleteRow]="false"
      [showToolbarTop]="false"
      [showToolbarBottom]="false"
      [isSearchable]="false"
      [tableHeight]="520"
      (emittendButtonCellClick)="gridAction($event)">
    </app-data-grid>
  </div>

  <div class="mobile-cards">
    <article class="static-page-card" *ngFor="let page of filteredPages">
      <div>
        <h2>{{ page.title }}</h2>
        <span>{{ page.slug }}</span>
      </div>
      <p>Versione: {{ page.version }}.0 · Aggiornata: {{ page.updatedAt | date:'short' }}</p>
      <div class="actions">
        <button type="button" class="btn btn-outline-primary" (click)="openEdit(page)">
          <span class="mdi mdi-pencil-outline" aria-hidden="true"></span>
          Modifica
        </button>
        <button type="button" class="btn btn-outline-danger" [disabled]="deletingId === page.id" (click)="deletePage(page)">
          <span class="mdi mdi-delete-outline" aria-hidden="true"></span>
          Elimina
        </button>
      </div>
    </article>
  </div>
</app-anagrafica-wrapper>
