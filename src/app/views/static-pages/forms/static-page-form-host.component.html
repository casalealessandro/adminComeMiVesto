<section class="static-page-form" aria-live="polite">
  <div *ngIf="error" class="alert alert-danger" role="alert">{{ error }}</div>

  <app-dynamic-form
    [service]="formId"
    [editData]="editData"
    [showBottomButtons]="true"
    [inputBtnLeftName]="'Annulla'"
    [inputBtnRightName]="'Salva'"
    [loading]="saving"
    (submitFormEvent)="handleForm($event)">
  </app-dynamic-form>
</section>
