<div class="data-grid-shell" [attr.data-grid-id]="idTable">
  <div class="table-responsive">
    <table class="table data-grid-table mb-0" [id]="idTable.toString()">
      <thead>
        <tr>
          <th
            *ngFor="let column of columns"
            scope="col"
            [style.width]="width(column)"
            [class.sortable]="column.dataField && column.type !== 'campoButton' && column.type !== 'campoImg'"
            (click)="sort(column)"
          >
            <span>{{ caption(column) }}</span>
            <span *ngIf="sortField === column.dataField" class="sort-indicator" aria-hidden="true">
              {{ sortDirection === 'asc' ? '▲' : '▼' }}
            </span>
          </th>
          <th *ngIf="isEditable" scope="col" class="actions-column">Azioni</th>
        </tr>
      </thead>

      <tbody>
        <tr
          *ngFor="let row of rows; let rowIndex = index; trackBy: trackRow"
          [class.selected-row]="selectedRowIndex === rowIndex"
          (click)="selectRow($event, row, rowIndex)"
          (dblclick)="doubleClickRow($event, row, rowIndex)"
        >
          <td
            *ngFor="let column of columns"
            [class]="column.class || ''"
            [style.text-align]="column.colAlignment || (column.type === 'campoNumber' ? 'right' : 'left')"
          >
            <ng-container [ngSwitch]="column.type">
              <img
                *ngSwitchCase="'campoImg'"
                class="cell-image"
                [src]="row?.[column.dataField] || 'https://ionicframework.com/docs/img/demos/avatar.svg'"
                [alt]="caption(column) || 'Immagine'"
                loading="lazy"
              >

              <button
                *ngSwitchCase="'campoButton'"
                type="button"
                class="btn btn-sm btn-outline-secondary cell-action"
                [attr.title]="column.button?.hint || column.button?.name || caption(column)"
                (click)="cellButtonClick($event, column, row, rowIndex)"
              >
                <span *ngIf="column.button?.icon" [class]="column.button.icon" aria-hidden="true"></span>
                <span *ngIf="column.button?.text">{{ column.button.text }}</span>
              </button>

              <span *ngSwitchDefault>{{ displayValue(row, column) }}</span>
            </ng-container>
          </td>

          <td *ngIf="isEditable" class="row-actions">
            <button
              *ngIf="isEditableEditRow"
              type="button"
              class="btn btn-sm btn-outline-primary"
              title="Modifica"
              aria-label="Modifica"
              (click)="editRow($event, row, rowIndex)"
            >
              <span class="mdi mdi-pencil-outline" aria-hidden="true"></span>
            </button>
            <button
              *ngIf="isEditableDeleteRow"
              type="button"
              class="btn btn-sm btn-outline-danger"
              title="Elimina"
              aria-label="Elimina"
              (click)="deleteRow($event, row, rowIndex)"
            >
              <span class="mdi mdi-trash-can-outline" aria-hidden="true"></span>
            </button>
          </td>
        </tr>

        <tr *ngIf="!rows.length">
          <td [attr.colspan]="columns.length + (isEditable ? 1 : 0)" class="empty-state">
            Nessun dato disponibile.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
