<header class="caption-container" [ngClass]="cssClass">
  <h2 class="page-title">{{ caption }}</h2>

  <div class="caption-actions">
    <button
      *ngIf="addButtonShow"
      type="button"
      class="btn ana-button add-button"
      (click)="add()"
    >
      <span class="mdi mdi-plus" aria-hidden="true"></span>
      Aggiungi
    </button>

    <button
      *ngIf="isClosable"
      type="button"
      class="btn icon-button close-button"
      aria-label="Chiudi"
      (click)="close()"
    >
      <span class="mdi mdi-window-close" aria-hidden="true"></span>
      Chiudi
    </button>
  </div>
</header>
